# Site settings
accent_color: "#1a7a6d"
dark_mode: true
description: "Personal academic website of Yihan Wang, an undergraduate student at Peking University."
baseurl: ""
url: "https://anonymous-yh.github.io"
future: false

analytics:
  google_id: ""

nav_pages:
  - name: about
  - name: research
  - name: publications
  - name: blogs
  - name: cv

include:
  - _pages

sass:
  quiet_deps: true
  style: compressed

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true

plugins:
  - jekyll/scholar
  - jekyll-sitemap

scholar:
  source: /assets/
  bibliography: ref.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending

exclude:
  - Gemfile
  - Gemfile.lock
  - Rakefile
  - node_modules
  - package.json
  - package-lock.json
  - docs
